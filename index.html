<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Пропавшая папка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;600;800&display=swap">
<style>
html,body{margin:0}
/* Layout: full-screen phone stage — background art, one character sprite, dialogue card pinned to the bottom */
:root{
  --ink:#16121f; --panel:rgba(22,18,33,.86); --line:rgba(255,255,255,.14);
  --text:#f3eefb; --muted:#b9b0c9; --folder:#3d5bd9; --hoodie:#ffd23f; --violet:#8d6bd6;
  --display:"Prata",Georgia,serif; --body:"Manrope",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--ink)}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s}
#sprite{position:absolute;left:50%;bottom:22%;height:62%;transform:translateX(-50%);max-width:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45));transition:opacity .35s, transform .35s}
#sprite.off{opacity:0;transform:translate(-50%,12px)}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;z-index:5;pointer-events:none}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
#box{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 18px 16px;min-height:120px;backdrop-filter:blur(10px);z-index:4;cursor:pointer}
#who{position:absolute;top:-15px;left:16px;background:var(--hoodie);color:var(--ink);font-weight:800;font-size:14px;padding:5px 14px;border-radius:999px;letter-spacing:.02em}
#who.n{display:none}
#who.me{background:var(--folder);color:#fff}
#who.ghost{background:var(--violet);color:#fff}
#txt{font-size:17px;line-height:1.5;margin:0;min-height:52px}
#txt.narr{font-style:italic;color:var(--muted)}
#tap{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--muted);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
#choices{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:6}
#choices button{font:600 16px/1.35 var(--body);color:var(--text);background:var(--panel);border:1.5px solid var(--violet);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;backdrop-filter:blur(10px)}
#choices button:active,#choices button:focus-visible{background:var(--violet);outline:none}
#choices .q{font-size:13px;color:var(--muted);text-align:center;margin-bottom:2px}
#cg{position:absolute;inset:0;z-index:8;background:#000 center/cover no-repeat;cursor:pointer}
#cg span{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 6px #000}
#toast{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-10px);opacity:0;z-index:9;background:var(--folder);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;width:min(86%,420px);text-align:center;transition:.35s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-block:24px calc(28px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(22,18,31,.1) 0%,rgba(22,18,31,.35) 40%,rgba(22,18,31,.96) 78%)}
.screen h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.05;margin:0;text-wrap:balance}
.screen h1 em{font-style:normal;color:#8aa2ff}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hoodie);font-weight:800}
.screen p{margin:0;color:var(--muted);line-height:1.5;font-size:15px}
.screen label{font-size:13px;color:var(--muted)}
.screen input{font:600 17px var(--body);color:var(--text);background:rgba(255,255,255,.08);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;box-sizing:border-box}
.screen input:focus{outline:none;border-color:#8aa2ff}
.btn{font:800 17px var(--body);background:var(--hoodie);color:var(--ink);border:0;border-radius:14px;padding:15px;cursor:pointer}
.btn:focus-visible{outline:3px solid #fff}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.stats{display:flex;gap:10px}
.stats div{flex:1;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.cluelist{margin:0;padding-left:18px;color:var(--muted);font-size:14px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="stage">
  <div class="bg" id="bg"></div>
  <img id="sprite" class="off" alt="">
  <div id="hud" hidden><span class="chip" id="hudClues">🔍 0/4</span><span class="chip" id="hudEth">⚖️ 0</span></div>
  <div id="box" hidden><div id="who"></div><p id="txt"></p><span id="tap">▼ нажми</span></div>
  <div id="choices" hidden></div>
  <div id="cg" hidden><span>нажми, чтобы продолжить</span></div>
  <div id="toast"></div>

  <div class="screen" id="title">
    <div class="eyebrow">Департамент философии · УрФУ</div>
    <h1>Пропавшая <em>папка</em></h1>
    <p>Через час проверка. Документы программы «Прикладная этика в бизнесе и промышленности» исчезли. Иван Валентинович в панике. Вся надежда на тебя.</p>
    <label for="nameInput">Как тебя зовут?</label>
    <input id="nameInput" maxlength="20" placeholder="Например, Вика" autocomplete="off">
    <button class="btn" id="startBtn">Начать расследование</button>
    <p id="found" style="font-size:13px"></p>
  </div>

  <div class="screen" id="end" hidden>
    <div class="eyebrow" id="endNum"></div>
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <div class="stats"><div><b id="sClues"></b><small>улик найдено</small></div><div><b id="sEth"></b><small>очков этики</small></div></div>
    <ul class="cluelist" id="endClues"></ul>
    <button class="btn" id="againBtn">Сыграть ещё раз</button>
  </div>
</div>

<script>
// ---------- Telegram (подключается только внутри Telegram) ----------
if (/tgWebApp/.test(location.hash)) {
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js';
  s.onload = () => { try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch(e){} };
  document.head.appendChild(s);
}

// ---------- Персонажи ----------
const CH = {
  iv:   {name:'Иван Валентинович', img:'iv.webp'},
  yana: {name:'Яна Александровна', img:'yana.webp'},
  dasha:{name:'Дарья Алексеевна', img:'dasha.webp'},
  dio:  {name:'Диоген', img:'diogenes.webp', cls:'ghost'},
  insp: {name:'Проверяющий', img:'inspector.webp'}
};

// ---------- Сценарий ----------
// s: кто говорит (n — рассказчик, me — игрок), t: текст, ch: какого персонажа показать (null — никого)
// clue: найденная улика, eth: изменение этики, cg: полноэкранная картинка, go: переход в сцену
const S = {
  s1: {bg:'bg_office', ch:null, steps:[
    {s:'n', t:'Понедельник, 9:47. Ты заходишь в департамент философии, чтобы просто сдать эссе. Просто. Сдать. Эссе.'},
    {s:'n', t:'Из кабинета доносится грохот, шелест бумаг и голос: «Так, без паники. Паника — это не по-стоически».'},
    {s:'iv', t:'{name}! Слава Аристотелю, ты здесь. У нас ЧП.'},
    {s:'iv', t:'Через час приходит проверка. А папка с документами программы пропала. Синяя. Толстая. Наша.'},
    {s:'me', t:'Может, она просто где-то в кабинете?'},
    {s:'iv', t:'Я обыскал всё. Даже под Кантом смотрел.'},
    {s:'n', t:'Он кивает на «Критику чистого разума», которая явно годами служила подставкой под монитор.'},
    {s:'iv', t:'Если папку не найдём, программе конец. А я ведь всем обещал: прикладная этика — это деньги, тачки, карьера…'},
    {s:'iv', t:'И не надо так смотреть. Это была метафора. Частично.'},
    {s:'iv', t:'Ладно. Сейчас расскажу, как всё было. Первая история…'},
    {choose:'Что делать?', opts:[
      {t:'Дослушать все истории', go:'s1a'},
      {t:'Перебить: «Где вы были вчера?»', go:'s1b'}
    ]}
  ]},
  s1a: {bg:'bg_office', ch:'iv', steps:[
    {s:'iv', t:'Первая история: утром папка лежала на столе. Я её погладил. Мы с ней друзья.'},
    {s:'iv', t:'Вторая история: я пошёл за кофе. Автомат опять выдал какао. Это знак, я считаю.'},
    {s:'iv', t:'Третья история — про одну абстрактную страну, где документы заполняются сами. Но это не сейчас. Нас слушают.'},
    {s:'n', t:'Он многозначительно смотрит на вентиляцию.'},
    {s:'iv', t:'Четвёртая история: вчера после обеда я был у первокурсников. Объяснял, почему они зря не пошли к нам. Было жарко, я снял толстовку…'},
    {s:'iv', t:'Пятая история…'},
    {s:'n', t:'Ты почти засыпаешь. Но одна деталь цепляет: аудитория первокурсников и снятая толстовка.', clue:'Вчера Иван Валентинович был у первокурсников и снимал толстовку'},
    {s:'iv', t:'…и вот так, {name}, я понял, что этика — это жизнь. Всё, беги ищи! Время пошло!', go:'s2'}
  ]},
  s1b: {bg:'bg_office', ch:'iv', steps:[
    {s:'me', t:'Иван Валентинович, а коротко: где вы были вчера?'},
    {s:'iv', t:'Коротко?! Философ не умеет коротко! …Ладно. Кабинет, коридор, кофе. Всё. Устраивает?'},
    {s:'n', t:'Он выглядит так, будто у него отобрали лекцию. Зато ты сэкономишь минут двадцать.'},
    {s:'iv', t:'Иди. Ищи. И если что — я тебя не задушу. Наверное. Шутка! Беги.', go:'s2'}
  ]},
  s2: {bg:'bg_corridor', ch:null, steps:[
    {s:'n', t:'Коридор. Пусто. Только объявление на доске: «Утерян смысл жизни. Нашедшему — зачёт».'},
    {s:'n', t:'Из-за угла вылетает Яна Александровна: сумка, телефон и лицо человека, который опаздывает уже не первый раз за утро.'},
    {s:'yana', t:'Ой! {name}! Прости, бегу, у меня пара началась… десять минут назад. Или пятнадцать. Время — социальный конструкт.'},
    {s:'n', t:'Телефон выскальзывает у неё из рук. Экран загорается.'},
    {cg:'cg_cat'},
    {s:'me', t:'Это… ваша кошка молится?'},
    {s:'yana', t:'Конечно. Каждое утро. Холодильнику. У неё своя метафизика, и я её уважаю.'},
    {s:'yana', t:'А ты чего тут бегаешь?'},
    {s:'me', t:'Ищу папку Ивана Валентиновича. Синюю. Пропала.'},
    {s:'yana', t:'Хм. Вчера я забегала к первокурсникам за маркером, и там на стуле висело что-то фиолетовое. Большое. Мягкое. Я не стала трогать — вдруг оно живое.'},
    {s:'yana', t:'Слушай, а можно просьбу? Если проверяющий спросит, скажи, что я с утра на месте. Ну, морально я на месте.'},
    {choose:'Яна Александровна ждёт ответа', opts:[
      {t:'«Конечно, прикрою»', go:'s2a'},
      {t:'«Давайте я лучше скажу, что вы уже бежите»', go:'s2b'}
    ]}
  ]},
  s2a: {bg:'bg_corridor', ch:'yana', steps:[
    {s:'yana', t:'Ты золото! Всё, убегаю!', eth:-1},
    {s:'n', t:'Приятно. Но где-то внутри тихо вздыхает Кант.', clue:'Вчера в аудитории первокурсников на стуле висело что-то фиолетовое', go:'s3'}
  ]},
  s2b: {bg:'bg_corridor', ch:'yana', steps:[
    {s:'yana', t:'Ха! Справедливо. Вот что значит этик. Ладно, бегу. Честно бегу!', eth:1},
    {s:'n', t:'Она исчезает за поворотом. Совесть чиста, а в голове крутится «что-то фиолетовое».', clue:'Вчера в аудитории первокурсников на стуле висело что-то фиолетовое', go:'s3'}
  ]},
  s3: {bg:'bg_classroom', ch:null, steps:[
    {s:'n', t:'Ты заглядываешь в аудиторию. На столах тарелки с огурцами и виноградом. Студенты разделены на два лагеря, и один явно на грани бунта.'},
    {s:'n', t:'В центре — Дарья Алексеевна. Как всегда, в образе, который хочется разобрать на референсы.'},
    {s:'dasha', t:'{name}, заходи! У нас эксперимент. Помнишь обезьянок-капуцинов?'},
    {s:'dasha', t:'Двум обезьянам дали одно и то же задание. Одной платили огурцом, другой — виноградом. Та, что с огурцом, увидела несправедливость и швырнула огурец обратно в учёного.'},
    {s:'dasha', t:'Чувство справедливости древнее философии. Его понимают даже обезьяны. Сейчас проверяем студентов.'},
    {s:'n', t:'С задних парт в подтверждение пролетает ломтик огурца.'},
    {s:'dasha', t:'Помоги мне — и я помогу тебе. Осталась последняя тарелка винограда. Как её раздать?'},
    {choose:'Как разделить виноград?', opts:[
      {t:'Всем поровну', go:'s3a'},
      {t:'Тем, кто больше сделал', go:'s3b'},
      {t:'Тем, кому досталось меньше всех', go:'s3c'}
    ]}
  ]},
  s3a: {bg:'bg_classroom', ch:'dasha', steps:[
    {s:'dasha', t:'Эгалитаризм! Каждому по паре виноградин. Скромно, зато мирно. Огурцы опускаются.', eth:1, go:'s3d'}
  ]},
  s3b: {bg:'bg_classroom', ch:'dasha', steps:[
    {s:'dasha', t:'Каждому по заслугам — Аристотель бы одобрил. Правда, теперь все спорят, кто сколько сделал. Но это уже тема следующей пары.', eth:1, go:'s3d'}
  ]},
  s3c: {bg:'bg_classroom', ch:'dasha', steps:[
    {s:'dasha', t:'Ролз! Принцип различия: неравенство допустимо, только если оно на пользу самым обделённым. Огуречники рыдают от счастья.', eth:1, go:'s3d'}
  ]},
  s3d: {bg:'bg_classroom', ch:'dasha', steps:[
    {s:'dasha', t:'Хорошо рассуждаешь. Ну, говори, что ищешь?'},
    {s:'me', t:'Синюю папку Ивана Валентиновича.'},
    {s:'dasha', t:'Папку не видела. Но кое-что скажу как человек, который всегда замечает одежду.'},
    {s:'dasha', t:'Сегодня Иван Валентинович в жёлтой толстовке. А вчера был в фиолетовой. И домой ушёл в одной футболке. В октябре. Я ещё подумала: смелый выбор.', clue:'Вчера ИВ был в фиолетовой толстовке и ушёл домой без неё'},
    {s:'dasha', t:'Увидишь Яну — передай, что я заняла нам места на обед. Если она, конечно, к обеду успеет.', go:'s4'}
  ]},
  s4: {bg:'bg_coffee', ch:null, steps:[
    {s:'n', t:'В этом углу коридора всегда полумрак. Ты падаешь на скамейку у кофейного автомата.'},
    {s:'n', t:'До проверки пятнадцать минут. Папки нет. Сил нет. В автомате остался последний стаканчик кофе.'},
    {s:'n', t:'Ты закрываешь глаза. А когда открываешь, рядом кто-то стоит. С фонарём. Днём. В помещении.'},
    {s:'dio', t:'Ищу человека.'},
    {s:'me', t:'…А я — папку.'},
    {s:'dio', t:'Хуже. Человека хоть иногда находят.'},
    {s:'dio', t:'Я Диоген. Да, тот самый: жил в бочке, а Александру Македонскому велел отойти и не заслонять солнце. Здесь, кстати, в коридоре неплохая бочка стоит.'},
    {s:'dio', t:'Но я замёрз. А у тебя последний кофе. Отдашь старику?'},
    {choose:'Последний кофе', opts:[
      {t:'Отдать кофе', go:'s4a'},
      {t:'Оставить себе', go:'s4b'}
    ]}
  ]},
  s4a: {bg:'bg_coffee', ch:'dio', steps:[
    {s:'dio', t:'Отдать последнее — почти по-киникски. Тогда слушай. Ты ищешь снаружи. А вещи теряются не в коридорах, а в привычках.', eth:1},
    {s:'dio', t:'Тот, кто снимает одежду, когда жарко, снимает с ней и всё, что лежит в карманах.', clue:'Диоген: ищи в карманах того, кто снимал одежду'},
    {s:'n', t:'Он отхлёбывает кофе, морщится («какао!») и растворяется в воздухе вместе с фонарём.', go:'deduce'}
  ]},
  s4b: {bg:'bg_coffee', ch:'dio', steps:[
    {s:'dio', t:'Понимаю. Кофе — тоже форма бытия.'},
    {s:'dio', t:'Тогда загадка: что ищешь, то близко, но не там, где ищешь. Удачи.'},
    {s:'n', t:'Он исчезает. Фонарь гаснет последним. Загадка понятна примерно наполовину.', go:'deduce'}
  ]},
  deduce: {bg:'bg_coffee', ch:null, steps:[
    {s:'n', t:'Ты собираешь в голове всё, что знаешь.'},
    {fn: st => st.clues.length >= 4 ? 'deduceFull' : (st.eth >= 2 ? 'deduceLate' : 'end3')}
  ]},
  deduceFull: {bg:'bg_coffee', ch:null, steps:[
    {s:'n', t:'Аудитория первокурсников. Жарко. Снятая толстовка. Что-то фиолетовое на стуле. Карманы…'},
    {s:'me', t:'Ну конечно!', go:'find'}
  ]},
  deduceLate: {bg:'bg_coffee', ch:null, steps:[
    {s:'n', t:'Что-то фиолетовое… аудитория… Пазл не складывается до конца, и ты долго бродишь по этажу.'},
    {s:'n', t:'Только когда часы бьют десять, ты решаешь проверить аудиторию первокурсников.', go:'find'}
  ]},
  find: {bg:'bg_finale', ch:null, steps:[
    {s:'n', t:'Аудитория пуста. На спинке стула висит фиолетовая толстовка. А из её кармана торчит синий уголок.'},
    {s:'n', t:'Папка. Та самая. Синяя. Толстая. Наша.'},
    {fn: st => st.clues.length >= 4 ? 'end1' : 'end2'}
  ]},
  end1: {bg:'bg_corridor', ch:null, steps:[
    {s:'n', t:'Ты влетаешь в кабинет за пять минут до проверки и поднимаешь папку над головой, как трофей.'},
    {s:'iv', t:'{name}!!! Первая история: мы спасены. Вторая история: я никогда ещё так не любил этот факультет.'},
    {s:'iv', t:'Третья история: ты теперь Почётный детектив программы. Это должность. Я её только что придумал. Деньги и тачки — позже.'},
    {s:'insp', t:'Документы в порядке. Программа у вас, я смотрю… энергичная.'},
    {s:'iv', t:'Вы даже не представляете.', ending:1}
  ]},
  end2: {bg:'bg_corridor', ch:null, steps:[
    {s:'n', t:'Ты возвращаешься с папкой, но проверяющий уже здесь. Иван Валентинович бледен, как бюст Платона.'},
    {s:'insp', t:'Итак. Где документы?'},
    {s:'me', t:'Вот. Папка нашлась в аудитории, в кармане толстовки. Честно говоря, мы её чуть не потеряли. Но нашли.'},
    {s:'insp', t:'Хм. Обычно в такой ситуации мне рассказывают, что папку съела собака.'},
    {s:'insp', t:'Признать ошибку и исправить её — это, знаете ли, тоже прикладная этика. Ставлю плюс.'},
    {s:'iv', t:'(шёпотом) {name}, я тебя задушу… благодарностью. Исключительно благодарностью.', ending:2}
  ]},
  end3: {bg:'bg_office', ch:null, steps:[
    {s:'n', t:'Время вышло. Папки нет. В дверях стоит проверяющий.'},
    {s:'insp', t:'Документы, пожалуйста.'},
    {s:'iv', t:'Конечно. Но сначала… первая история.'},
    {s:'n', t:'Проходит десять минут. Двадцать. Сорок.'},
    {s:'iv', t:'…и вот тогда, в той самой абстрактной стране, я понял: этика — это не предмет. Это образ жизни. Седьмая история…'},
    {s:'insp', t:'Подождите. А… на эту программу ещё можно поступить?'},
    {s:'n', t:'Проверяющий уходит с подписанным актом и анкетой абитуриента. Папку находят через неделю в кармане фиолетовой толстовки. Никто не удивлён.', ending:3}
  ]}
};

const ENDINGS = {
  1:{title:'Деньги, тачки, аккредитация', text:'Все улики собраны, папка найдена вовремя. Ты — Почётный детектив программы.'},
  2:{title:'Вот она, прикладная этика', text:'Папка нашлась с опозданием, но честность спасла проверку.'},
  3:{title:'Третья история', text:'Папку не нашли, но Иван Валентинович завербовал проверяющего. Попробуй собрать все улики.'}
};

// ---------- Движок ----------
const $ = id => document.getElementById(id);
let st, scene, idx, typing = null, fullText = '', waitTap = false;
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const sub = t => t.replace(/\{name\}/g, st.name);
Object.values({...CH}).forEach(c => { const i = new Image(); i.src = c.img; });
['bg_office','bg_corridor','bg_classroom','bg_coffee','bg_finale','cg_cat'].forEach(b => { const i = new Image(); i.src = `${b}.jpg`; });

function showFound(){
  const f = store.get('endings') || [];
  $('found').textContent = f.length ? `Открыто концовок: ${f.length} из 3` : '3 концовки · 5–7 минут';
}
function setBg(name){ $('bg').style.backgroundImage = `url(${name}.jpg)`; }
function setSprite(key){
  const sp = $('sprite');
  if (!key){ sp.classList.add('off'); sp.dataset.k = ''; return; }
  if (sp.dataset.k === key) return;
  sp.classList.add('off');
  setTimeout(() => { sp.src = CH[key].img; sp.alt = CH[key].name; sp.dataset.k = key; sp.classList.remove('off'); }, sp.dataset.k ? 180 : 0);
}
function hud(){ $('hudClues').textContent = `🔍 ${st.clues.length}/4`; $('hudEth').textContent = `⚖️ ${st.eth}`; }
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600); }

function go(id){ scene = S[id]; idx = 0; setBg(scene.bg); setSprite(scene.ch); step(); }

function step(){
  const s = scene.steps[idx];
  $('choices').hidden = true;
  if (s.fn){ return go(s.fn(st)); }
  if (s.cg){
    $('box').hidden = true;
    const cg = $('cg'); cg.style.backgroundImage = `url(${s.cg}.jpg)`; cg.hidden = false;
    cg.onclick = () => { cg.hidden = true; next(); };
    return;
  }
  if (s.choose){
    $('box').hidden = true;
    const c = $('choices'); c.innerHTML = `<div class="q">${s.choose}</div>`;
    s.opts.forEach(o => {
      const b = document.createElement('button'); b.textContent = sub(o.t);
      b.onclick = () => go(o.go); c.appendChild(b);
    });
    c.hidden = false; return;
  }
  // реплика
  $('box').hidden = false;
  const who = $('who'), txt = $('txt');
  if (s.s === 'n'){ who.className = 'n'; txt.className = 'narr'; }
  else if (s.s === 'me'){ who.className = 'me'; who.textContent = st.name; txt.className = ''; }
  else { who.className = CH[s.s].cls || ''; who.textContent = CH[s.s].name; txt.className = ''; setSprite(s.s); }
  if (s.ch !== undefined) setSprite(s.ch);
  if (s.eth){ st.eth += s.eth; hud(); toast(s.eth > 0 ? '⚖️ Этика +1' : '⚖️ Этика −1'); }
  if (s.clue && !st.clues.includes(s.clue)){ st.clues.push(s.clue); hud(); setTimeout(() => toast('🔍 Улика: ' + s.clue), s.eth ? 900 : 0); }
  type(sub(s.t));
}
function type(t){
  fullText = t; const txt = $('txt'); txt.textContent = ''; $('tap').hidden = true;
  let i = 0; clearInterval(typing);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ txt.textContent = t; done(); return; }
  typing = setInterval(() => { txt.textContent = t.slice(0, ++i); if (i >= t.length) done(); }, 22);
}
function done(){ clearInterval(typing); typing = null; $('txt').textContent = fullText; $('tap').hidden = false; }
function next(){
  const s = scene.steps[idx];
  if (s && s.ending) return ending(s.ending);
  if (s && s.go) return go(s.go);
  idx++; step();
}
$('box').onclick = () => { if (typing) done(); else next(); };

function ending(n){
  const f = store.get('endings') || []; if (!f.includes(n)) { f.push(n); store.set('endings', f); }
  $('box').hidden = true; $('hud').hidden = true; setSprite(null);
  $('endNum').textContent = `Концовка ${n} из 3 · открыто ${f.length} из 3`;
  $('endTitle').textContent = `«${ENDINGS[n].title}»`;
  $('endText').textContent = ENDINGS[n].text;
  $('sClues').textContent = `${st.clues.length}/4`; $('sEth').textContent = st.eth;
  $('endClues').innerHTML = st.clues.map(c => `<li>${c}</li>`).join('');
  $('end').hidden = false;
}
function start(){
  const name = ($('nameInput').value.trim() || 'Студент').slice(0,20);
  store.set('name', name);
  st = {name, clues:[], eth:0};
  $('title').hidden = true; $('end').hidden = true; $('hud').hidden = false; hud();
  go('s1');
}
$('startBtn').onclick = start;
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('againBtn').onclick = () => { $('end').hidden = true; $('title').hidden = false; setBg('bg_title'); showFound(); };
$('nameInput').value = store.get('name') || '';
setBg('bg_title'); showFound();
</script>
</body>
</html>
